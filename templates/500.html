{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del servidor — Clínica Jurídica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="error-page">
        <div class="error-container">
            <div class="error-icon e500">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div class="error-code">500</div>
            <h1 class="error-title">Error del servidor</h1>
            <p class="error-desc">
                Ha ocurrido un error interno inesperado.<br>
                Por favor, intenta nuevamente o contacta al administrador.
            </p>
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                <a href="{% url 'gestion:dashboard' %}" class="btn-primary">
                    <i class="fas fa-th-large"></i> Ir al inicio
                </a>
                <button onclick="location.reload()" class="btn-secondary">
                    <i class="fas fa-redo"></i> Reintentar
                </button>
            </div>
        </div>
    </div>
</body>
</html>
